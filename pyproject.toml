[project]
name = "probability-sonification"
version = "0.1.0"
description = "An interactive experiment for hearing probability distributions."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "altair>=5.5",
    "numpy>=2.0",
    "pretty-midi>=0.2.11",
    "pyfluidsynth>=1.3.4",
    "scipy>=1.14",
    "streamlit>=1.42",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "ipywidgets>=8.1",
    "matplotlib>=3.10",
    "pytest>=8.3",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probability_sonification"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
